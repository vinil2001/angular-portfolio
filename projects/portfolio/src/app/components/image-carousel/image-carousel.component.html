<div class="relative w-full overflow-hidden rounded-t-lg" [class]="height">
  <!-- Images -->
  <div class="relative h-full group">
    <img *ngFor="let img of images; let i = index"
         [src]="img"
         [class.hidden]="i !== currentIndex"
         class="w-full h-full object-cover transition-opacity duration-300 cursor-pointer"
         [class.cursor-zoom-in]="showPreview"
         (click)="openPreview(i)"
         alt="Project image">
    
    <!-- Expand icon for preview -->
    <div *ngIf="showPreview && images.length > 0" 
         class="absolute top-2 right-2 bg-black/50 text-white p-2 rounded-full opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer"
         (click)="openPreview(currentIndex)"
         title="Click to open gallery">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path>
      </svg>
    </div>
  </div>

  <!-- Navigation buttons -->
  <button *ngIf="images.length > 1"
          (click)="prev(); $event.stopPropagation()"
          class="absolute left-2 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-gray-800 rounded-full p-2 shadow-lg transition-all z-10">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
    </svg>
  </button>

  <button *ngIf="images.length > 1"
          (click)="next(); $event.stopPropagation()"
          class="absolute right-2 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-gray-800 rounded-full p-2 shadow-lg transition-all z-10">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
    </svg>
  </button>

  <!-- Dots indicator -->
  <div *ngIf="images.length > 1" class="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-2 z-10">
    <button *ngFor="let img of images; let i = index"
            (click)="goToSlide(i); $event.stopPropagation()"
            [class]="i === currentIndex 
              ? 'w-2 h-2 bg-white rounded-full' 
              : 'w-2 h-2 bg-white/50 rounded-full hover:bg-white/75'">
    </button>
  </div>
</div>

<!-- Preview Modal -->
<div *ngIf="isPreviewOpen && showPreview" 
     class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center"
     (click)="closePreview()">
  <div class="relative p-4" (click)="$event.stopPropagation()">
    <!-- Close button -->
    <button (click)="closePreview()"
            class="absolute top-4 right-4 text-white/80 hover:text-white bg-black/50 rounded-full p-2 transition-colors z-10">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
    
    <!-- Preview image -->
    <img [src]="images[previewImageIndex]" 
         class="w-[80vw] h-[80vh] object-contain"
         alt="Project preview">
    
    <!-- Preview navigation -->
    <button *ngIf="images.length > 1"
            (click)="prevPreview()"
            class="absolute left-4 top-1/2 -translate-y-1/2 text-white/80 hover:text-white bg-black/50 rounded-full p-3 transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
      </svg>
    </button>
    
    <button *ngIf="images.length > 1"
            (click)="nextPreview()"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-white/80 hover:text-white bg-black/50 rounded-full p-3 transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
      </svg>
    </button>
    
    <!-- Image counter -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 text-white text-sm bg-black/50 px-3 py-1 rounded-full">
      {{ previewImageIndex + 1 }} / {{ images.length }}
    </div>
  </div>
</div>
