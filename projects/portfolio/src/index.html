<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>Andrii Boiko — Full-Stack .NET Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Andrii Boiko — Full-Stack .NET developer specialising in Umbraco, Azure and modern web. Portfolio, experience and projects.">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <script>
    // Apply the saved theme before paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var saved = localStorage.getItem('dark-mode');
        var dark = saved === null ? true : saved === 'true';
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
