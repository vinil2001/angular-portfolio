<div class="max-w-1000px mx-auto fade-in">
  <div class="bg-white rounded-lg shadow-xl overflow-hidden border-t-0 border-l-0 border-r-0 border-b-4 border-[#667eea]">
    <div class="bg-gradient-to-r from-[#667eea] to-[#764ba2] text-white p-8 text-center">
      <h1 class="text-4xl font-bold mb-2">
        My Portfolio
      </h1>
      <p class="text-lg opacity-95">
        Full Stack .NET Developer Projects
      </p>
    </div>
    
    <div class="p-8">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <app-project-card 
          *ngFor="let project of projects$ | async" 
          [project]="project"
          class="h-full">
        </app-project-card>
      </div>
    </div>
  </div>
</div>
