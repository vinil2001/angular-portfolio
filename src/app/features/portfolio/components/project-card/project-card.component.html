<div class="project-card bg-white rounded-lg shadow-md hover:shadow-xl transition-all duration-300 overflow-hidden group flex flex-col h-full">
  <!-- Image Carousel -->
  <app-image-carousel [images]="project.images || []"></app-image-carousel>
  
  <div class="p-6 flex flex-col flex-grow">
    <h3 class="text-xl font-semibold mb-3" style="color: #333;">
      {{ project.title }}
    </h3>
    <p class="text-gray-600 mb-6 leading-relaxed flex-grow">
      {{ project.description }}
    </p>
    
    <div class="flex flex-wrap gap-2 mb-6">
      <span *ngFor="let tech of project.technologies" 
            class="px-3 py-1 rounded-full text-xs font-medium text-white"
            style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        {{ tech }}
      </span>
    </div>
    
    <a *ngIf="project.link !== '#'" 
       [href]="project.link" 
       class="inline-flex items-center gap-2 font-medium text-white px-4 py-2 rounded-lg transition-all duration-300 hover:transform hover:translate-y-[-2px]"
       style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);">
      <span>View Project</span>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
      </svg>
    </a>
    <span *ngIf="project.link === '#'" class="text-gray-400 text-sm">
      Coming soon
    </span>
  </div>
</div>
