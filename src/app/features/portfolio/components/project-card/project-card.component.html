<article class="card project-card">
  <a class="project-link-wrap" routerLink="/project/{{ project.id }}" [attr.aria-label]="'View ' + project.title">
    <div class="project-media">
      <app-image-carousel [images]="project.images || []" height="h-52" [showPreview]="false"></app-image-carousel>
    </div>
  </a>

  <div class="project-body">
    <h3 class="project-title">{{ project.title }}</h3>
    <p class="project-desc">{{ project.description }}</p>

    <div class="project-tags">
      <span class="tag" *ngFor="let tech of project.technologies">{{ tech }}</span>
    </div>

    <a routerLink="/project/{{ project.id }}" class="project-cta">
      <span>View project</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
        <path d="M5 12h14M13 6l6 6-6 6"></path>
      </svg>
    </a>
  </div>
</article>
