<div class="filter" *ngIf="technologies.length > 0">
  <div class="filter-head">
    <span class="filter-label">Filter by tech</span>
    <button *ngIf="active.length > 0" type="button" class="filter-clear" (click)="clear.emit()">
      Clear ({{ active.length }})
    </button>
  </div>

  <div class="filter-chips">
    <button
      *ngFor="let tech of technologies"
      type="button"
      class="chip"
      [class.chip--active]="isActive(tech)"
      (click)="toggle.emit(tech)">
      {{ tech }}
      <svg *ngIf="isActive(tech)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="12" height="12">
        <path d="M18 6 6 18M6 6l12 12"></path>
      </svg>
    </button>
  </div>
</div>
